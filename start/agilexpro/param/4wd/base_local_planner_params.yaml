DWAPlannerROS:
# ==========================================
# 速度限制：防抖核心！低速、小转向、不抽搐
# ==========================================
  max_vel_x: 1.0
  min_vel_x: 1.0

  
  max_vel_theta: 0.6
  min_vel_theta: 0.0

# ==========================================
# 加速度：防抖关键！不能太大，否则必抖
# ==========================================
  acc_lim_x: 0.2
  acc_lim_th: 0.2
  acc_lim_trans: 0.0

# ==========================================
# 评分权重（不转圈、不摇头、直着走）
# ==========================================
  path_distance_bias: 20.0
  goal_distance_bias: 20.0
  occdist_scale: 0.03

# ==========================================
# 其他设置
# ==========================================
  forward_point_distance: 0.4
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.5

# ==========================================
# 采样点
# ==========================================
  sim_time: 1.5
  vx_samples: 5
  vy_samples: 0
  vth_samples: 3

# ==========================================
# 容忍度（防抖必须放宽）
# ==========================================
  xy_goal_tolerance: 1.0
  yaw_goal_tolerance: 0.3
  latch_xy_goal_tolerance: true


  use_dwa: true
