DWAPlannerROS:
# ==========================================
# 速度限制：降低最小转向，防止修正过头
# ==========================================
  max_vel_trans: 0.5
  min_vel_trans: 0.1
  
  max_vel_x: 0.4
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  
  max_vel_theta: 1.0
  # [修改] 之前是 0.5，太快了！履带车微调角度需要慢一点。
  # 改为 0.2 或 0.3，允许它做小幅度的角度修正。
  min_vel_theta: 0.2  

# ==========================================
# 加速度：保持这种“欺骗式”的高加速度，这没问题
# ==========================================
  acc_lim_x: 2.5
  acc_lim_y: 0.0
  acc_lim_th: 3.5
  acc_lim_trans: 2.5

# ==========================================
# 评分权重（解决只转圈的核心！！！）
# ==========================================
  # [修改] 之前是 32.0。权重太高会导致机器人有"强迫症"，
  # 只要车头没对准绿线，它就死活不肯走。
  # 建议大幅降低，告诉它：偏一点没关系，往终点挪就是了。
  path_distance_bias: 20.0  
  
  # [修改] 提高目标的权重，让它更渴望到达终点
  goal_distance_bias: 24.0  
  
  # [修改] 稍微增加一点避障分数，防止它为了贴合路径而撞墙
  occdist_scale: 0.05       

# ==========================================
# 其他设置
# ==========================================
  # [修改] 前瞻点距离。之前是 0.3。
  # 如果机器人总是原地转圈，可以试着把这个改成 0.0
  # 改为 0.0 意味着以“机器人中心”为基准进行评分，会让旋转逻辑更简单。
  forward_point_distance: 0.0 

  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

# ==========================================
# 采样点
# ==========================================
  sim_time: 2.0
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40

# ==========================================
# 容忍度
# ==========================================
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.30
  trans_stopped_vel: 0.1
  theta_stopped_vel: 0.1

  use_dwa: true
  restore_defaults: false
  prune_plan: false
